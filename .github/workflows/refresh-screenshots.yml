name: Atualizar capturas dos projetos

on:
  schedule:
    - cron: "17 9 * * *" # todo dia, 06:17 em Brasília
  workflow_dispatch: {}
  repository_dispatch:
    types: [project-updated]

permissions:
  contents: write

concurrency:
  group: refresh-screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Capturar os sites publicados
        run: node scripts/capture.mjs

      - name: Publicar se alguma tela mudou
        run: |
          if git diff --quiet -- assets/projects; then
            echo "Nenhuma tela mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projects
          git commit -m "chore: atualiza capturas dos projetos"
          git push
